<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f3f4f6"/>
  
  <!-- Decorative pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e5e7eb" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#grid)"/>
  
  <!-- Icon -->
  <g transform="translate(400, 250)">
    <!-- Fabric roll icon -->
    <rect x="-60" y="-40" width="120" height="80" rx="8" fill="#C9A85A" opacity="0.2"/>
    <rect x="-50" y="-30" width="100" height="60" rx="6" fill="none" stroke="#C9A85A" stroke-width="3"/>
    <line x1="-30" y1="-30" x2="-30" y2="30" stroke="#C9A85A" stroke-width="2" opacity="0.5"/>
    <line x1="0" y1="-30" x2="0" y2="30" stroke="#C9A85A" stroke-width="2" opacity="0.5"/>
    <line x1="30" y1="-30" x2="30" y2="30" stroke="#C9A85A" stroke-width="2" opacity="0.5"/>
  </g>
  
  <!-- Text -->
  <text x="400" y="380" font-family="Arial, sans-serif" font-size="24" fill="#9ca3af" text-anchor="middle" font-weight="600">
    Fabric Sample
  </text>
  <text x="400" y="410" font-family="Arial, sans-serif" font-size="18" fill="#d1d5db" text-anchor="middle">
    عينة القماش
  </text>
</svg>

